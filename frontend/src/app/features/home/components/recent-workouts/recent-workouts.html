<ul class="history-list">
    @for (item of historyService.recentWorkouts(); track item.workoutId) {
        <li>
            <div class="workout-card">
                <div class="workout-info">
                    <span class="workout-date">{{ item.date | date: 'longDate' }}</span>
                    <h3 class="workout-name"> {{ item.workoutName }}</h3>
                </div>
                <div class="workout-stats">
                    <div class="stat-group">
                        <span class="stat-duration">{{ item.durationInSeconds | duration }}</span>
                    </div>
                    <span>Resume ></span>
                </div>
            </div>
        </li>
    }
    @if(historyService.recentWorkouts().length === 0) {
        <li class="no-history">No recent workouts available</li>
    }
</ul>
