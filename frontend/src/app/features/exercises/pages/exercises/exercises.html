<section class="builder-section">
    <app-exercise-builder
        [exercise]="selectedExercise()"
        (finished)="selectedExercise.set(null)">
    </app-exercise-builder>
</section>
<section class="filter-section">
    <app-exercise-filter></app-exercise-filter>
</section>
<section class="list-section">
    <app-exercise-list (editRequested)="selectedExercise.set($event)"></app-exercise-list>
</section>
