<ul>
    @for (workout of mockService.workouts(); track workout.id) {
        <li>
            <div>
                {{ workout.name }}
                <button type="button" (click)="startWorkout(workout)"><b>Play</b></button>
                <a [routerLink]="['/workout-view', workout.id]">Edit</a>
            </div>
        </li>
    }
</ul>
